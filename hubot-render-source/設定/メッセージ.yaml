# BotがSlackへ送る文章は、このファイルで編集できます。
# 右側の文章だけを変更 → 保存 → HubotをCtrl+Cで止めてnpm startで再起動。
# 行頭のスペースと「:」は残してください。タブは使わず、スペースを使います。
# {ユーザー}などの波括弧は、Botが名前や数値に置き換える目印です。
# 「|」の次の行から書くと複数行のメッセージにできます。

入退室:
  # {ユーザー} は、その人へのSlackメンションになります。
  参加: 'マスター {ユーザー} さんが参加しました。歓迎の挨拶をすることをお勧めします'
  退出: 'マスター {ユーザー} さんが退出しました。'

朝の挨拶:
  # {起床時刻} は予定時刻、{分} は予定時刻からの差です。
  予定より早い: 'おはようございます、マスター 予定の{起床時刻}より{分}分早い起床です。'
  通常: 'おはようございます、マスター 予定の起床時刻{起床時刻}から{分}分遅い起床です。{ひとこと}'
  # 通常メッセージの {ひとこと} に入る文章。
  15分以内: 'マスターが設定した 許容範囲に該当しています'
  60分以内: 'マスター、夜更かしは貴方様の健康状態にも悪影響を及ぼします'
  180分以内: 'マスターが設定した 危険範囲に該当しています'
  180分より後: 'マスター... いいえ スケジュールの整理を始めましょう'

おみくじ:
  # 「- '文章'」の行は追加・削除できます。必ず1件以上残してください。
  # おみくじは毎回抽選、今日の運勢は同じ人・同じ日なら固定です。
  結果:
    - '大吉！気になっていたことをひとつ試してみよう。'
    - '中吉！小さな進歩がうれしい一日。'
    - '小吉！好きな音楽が味方になってくれそう。'
    - '吉！誰かへのひとことがいいきっかけに。'
    - '末吉！急がず、自分のペースでいこう。'
    - '凶！今日は無理せず、おやつと休憩を大切に。'
  おみくじ表示: 'おみくじ：{結果}'
  今日の運勢表示: '今日の運勢：{結果}'

音楽:
  選曲成功: |-
    今の貴方様方にピッタリの曲をセレクトしました
    {動画URL}
  取得失敗: '曲のセレクトに失敗しました'

ブックマーク:
  # 親投稿は最初の保存時だけ送信します。既存の親投稿は書き換えません。
  親投稿: |-
    :{絵文字}: ブックマーク集約
    保存した投稿はこのスレッドに保存されます。
  # {URL一覧} は保存したリンク、{元投稿} は元のSlack投稿へのリンクです。
  # {投稿者} と {保存した人} はSlackメンションになります。
  保存通知: |-
    :{絵文字}: ブックマーク
    {URL一覧}
    {元投稿} · {投稿者} · 保存した人：{保存した人}
  元投稿リンクの表示: '元の投稿'

スタンプ:
  # {内訳} は、絵文字ごとの個数です。0個なら空になります。
  合計通知: 'スタンプ合計：{合計}個{内訳}'
  内訳の1項目: ':{絵文字}: {個数}'
  スレッド案内: '数えたい投稿のスレッドで「@Bot名 スタンプ数」とお呼びください。'

表示変更:
  管理者以外: '表示の変更は、マスターのみ変更可能です。マスターの助手になればできないことはないです'
  変更完了: '変更完了 次回からこのスタイルで行きます'
  名前の入力エラー: '名前は1〜80文字で、@・改行・山括弧を含めずに指定してね。'
  アイコンの入力エラー: '絵文字（例 :emoji:）か、公開画像のHTTPS URLを指定してください。'
  画像URLの入力エラー: '公開画像のHTTPS URLを指定してください。'

案内:
  ヘルプ: |-
    マスター「おはよう」「おみくじ」「今日の運勢」「これ聴いて」が使用可能です。
    投稿のスレッドで「スタンプ数」と呼ぶと、その投稿の合計を数えます。管理者は「名前変更 名前」「アイコン変更 :絵文字:」「表示リセット」も使用可能です。
